<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Manifest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f6f4;--panel:#fff;--ink:#16161a;--soft:#5d5d66;--line:#e4e4e0;--chip:#efefec;
  --accent:#7c3aed;--changed:#fff4d6;--changed-ink:#8a5a00;--code:#f1f1ee;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e0e12;--panel:#17171c;--ink:#ececf1;--soft:#9a9aa6;--line:#2a2a33;--chip:#23232b;
  --changed:#3a2e10;--changed-ink:#ffd27a;--code:#1d1d24;}}
:root[data-theme="dark"]{--bg:#0e0e12;--panel:#17171c;--ink:#ececf1;--soft:#9a9aa6;--line:#2a2a33;--chip:#23232b;--changed:#3a2e10;--changed-ink:#ffd27a;--code:#1d1d24;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:0 auto;padding:14px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.bar h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
.bar .meta{color:var(--soft);font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 80px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:32px}
main{min-width:0}
nav{position:sticky;top:76px;align-self:start;font-size:13px}
nav a{display:block;color:var(--soft);text-decoration:none;padding:4px 0}
nav a:hover{color:var(--ink)}
@media (max-width:820px){.wrap{grid-template-columns:1fr}nav{display:none}}
section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:20px;overflow:hidden}
section h2{margin:0 0 4px;font-size:20px;letter-spacing:-.01em}
section .sub{color:var(--soft);font-size:13px;margin:0 0 16px}
.kv{display:grid;grid-template-columns:minmax(120px,220px) 1fr;border-top:1px solid var(--line)}
.kv>div{padding:9px 8px;border-bottom:1px solid var(--line);min-width:0}
.kv>.k{color:var(--soft);font-size:13px}
.kv .kv{border-top:0;margin:-4px 0}
.kv .kv>div{border-bottom:1px dashed var(--line)}
.kv .kv>div:nth-last-child(-n+2){border-bottom:0}
@media (max-width:560px){.kv{grid-template-columns:1fr}.kv>.k{border-bottom:0;padding-bottom:0}}
.changed{background:var(--changed)}
.changed>.k::after,.k.changed::after{content:"profile";margin-left:6px;font-size:10px;color:var(--changed-ink);border:1px solid currentColor;border-radius:4px;padding:0 4px}
.src{display:inline-block;margin-left:6px;font-size:10px;color:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 4px;vertical-align:1px}
.src.locked{color:var(--accent);border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border-radius:6px;padding:2px 8px;font-size:13px}
.empty{color:var(--soft);font-style:italic}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--soft);font-weight:600}
.tscroll{overflow-x:auto}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px;border:1px solid var(--line)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.swatch{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.swatch .c{height:64px}
.swatch .l{padding:8px 10px;font-size:12px}
.swatch .l b{display:block;font-size:13px}
.fonts{display:grid;gap:10px;margin-bottom:16px}
.font{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.font .s{font-size:28px;line-height:1.2}
.font .l{font-size:12px;color:var(--soft)}
.layouts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-bottom:16px}
.lay{border:1px solid var(--line);border-radius:10px;padding:12px}
.frame{position:relative;background:#1b1b22;border-radius:6px;overflow:hidden;margin:0 auto 10px}
.reg{position:absolute;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;text-transform:uppercase;letter-spacing:.04em}
.reg.speaker{background:color-mix(in srgb,var(--accent) 70%,#000)}
.reg.content{background:#3b3b48}
.reg.graphic{background:#a16207}
.reg.other{background:#475569}
.safe{position:absolute;pointer-events:none;background:repeating-linear-gradient(45deg,#ef444455 0 4px,#ef444422 4px 8px)}
.lay h3{margin:0;font-size:14px}
.lay p{margin:2px 0 0;font-size:12px;color:var(--soft)}
.beat{display:flex;height:34px;border-radius:8px;overflow:hidden;margin:6px 0 16px;border:1px solid var(--line)}
.beat div{display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;white-space:nowrap;overflow:hidden;border-right:1px solid #0003}
.bank-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.bank-filter button{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:4px 12px;font:inherit;font-size:12px;cursor:pointer}
.bank-filter button.on{background:var(--ink);color:var(--bg)}
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.tpl{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tpl .pv{aspect-ratio:16/9;background:#111;position:relative}
.tpl iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.tpl .body{padding:10px 12px;font-size:12px}
.tpl .body b{font-size:14px}
.tpl .body .chips{margin-top:6px}
.frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.frames figure{margin:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.frames img{width:100%;display:block}
.frames figcaption{padding:6px 8px;font-size:12px;color:var(--soft)}
code,pre{font-family:"JetBrains Mono",monospace;font-size:12px}
pre{background:var(--code);padding:14px;border-radius:10px;overflow:auto;max-height:420px}
.legend{font-size:12px;color:var(--soft);display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
</style>
</head>
<body>
<header><div class="bar">
  <h1 id="title">Video Manifest</h1><span class="meta" id="meta"></span>
  <div class="tabs" id="tabs"></div>
</div></header>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<script type="application/json" id="manifest">/*MANIFEST*/</script>
<script>
const M = JSON.parse(document.getElementById('manifest').textContent);
const SRC = M._sources || {}, LOCK = new Set(M._locked || []);
const SECTIONS = [
  ['identity','Identity','Who this is, what the edit feels like, and the rules that never break.'],
  ['profiles','Profiles','Each format the creator edits for. Pick one at the top to see its overrides.'],
  ['brand','Visual Brand','Colours, type, logo, shapes and texture every graphic pulls from.'],
  ['pacing','Pacing & Cutting','How tight the cut is.'],
  ['audio','Audio Editing','J-cuts, L-cuts, levels and the voice chain.'],
  ['music','Music',''],
  ['sfx','Sound Design',''],
  ['transitions','Transitions',''],
  ['camera','Camera & Framing',''],
  ['broll','B-roll',''],
  ['layouts','Layouts','Every layout, exact positions, and how the edit moves between them.'],
  ['structure','Video Structure','The segments a video is built from and the layout each one gets.'],
  ['captions','Captions',''],
  ['motionGraphics','Motion Graphics','Overall style, how to build them, and where they go.'],
  ['templates','Template Bank','Reusable graphics. Filter by category.'],
  ['color','Colour & Image',''],
  ['effects','Effects',''],
  ['workflow','AI Edit Workflow','The order to work in, what to decide alone, and the QA checklist.'],
  ['evidence','Evidence','Measured stats and frames the manifest was built from.'],
  ['json','Machine-readable','The full manifest as JSON. AI: apply base, then the chosen profile on top.']
];
const ROLE_COLORS = ['#7c3aed','#0ea5e9','#f59e0b','#10b981','#ef4444','#ec4899','#64748b'];
let profile = 'base';

const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
function merge(a, b){ if(!isObj(a)||!isObj(b)) return b===undefined?a:b; const o={...a}; for(const k in b) o[k]=merge(a[k],b[k]); return o; }
function paths(o, p='', out=new Set()){ if(isObj(o)){ for(const k in o) { const q=p?p+'.'+k:k; out.add(q); paths(o[k],q,out);} } return out; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hexRe = /^#([0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/i;
const label = k => k.replace(/([a-z])([A-Z])/g,'$1 $2').replace(/^./,c=>c.toUpperCase());

function view(){
  const base = M.base || {};
  if(profile==='base') return {data: base, changed: new Set()};
  const ov = Object.fromEntries(Object.entries(M.profiles[profile]||{}).filter(([k])=>!['label','platform','aspect','description'].includes(k)));
  return {data: merge(base, ov), changed: paths(ov)};
}
function badge(path){
  const s = (profile!=='base' && SRC['profiles.'+profile+'.'+path]) || SRC[path];
  const l = LOCK.has(path);
  return (s?`<span class="src">${esc(s)}</span>`:'') + (l?'<span class="src locked">locked</span>':'');
}
function val(v, path, ch){
  if(v===null || v===undefined || v==='' || (Array.isArray(v)&&!v.length) || (isObj(v)&&!Object.keys(v).length)) return '<span class="empty">not set</span>';
  if(typeof v === 'string') return hexRe.test(v) ? `<span class="sw" style="background:${v}"></span>${esc(v)}` : esc(v);
  if(typeof v !== 'object') return esc(v);
  if(Array.isArray(v)){
    if(v.every(x=>!isObj(x)&&!Array.isArray(x))) return `<div class="chips">${v.map(x=>`<span class="chip">${val(x)}</span>`).join('')}</div>`;
    return table(v);
  }
  return kv(v, path, ch);
}
function kv(o, path, ch){
  return `<div class="kv">${Object.entries(o).map(([k,v])=>{
    const p = path?path+'.'+k:k; const c = ch && ch.has(p) ? ' changed' : '';
    return `<div class="k${c}">${esc(label(k))}${badge(p)}</div><div class="${c.trim()}">${val(v,p,ch)}</div>`;
  }).join('')}</div>`;
}
function table(rows){
  const keys=[...new Set(rows.flatMap(r=>isObj(r)?Object.keys(r):[]))];
  return `<div class="tscroll"><table><tr>${keys.map(k=>`<th>${esc(label(k))}</th>`).join('')}</tr>${rows.map(r=>`<tr>${keys.map(k=>`<td>${isObj(r[k])||Array.isArray(r[k])?esc(JSON.stringify(r[k])):val(r[k])}</td>`).join('')}</tr>`).join('')}</table></div>`;
}
function resolveColor(c, colors){ return hexRe.test(c||'') ? c : (colors||{})[c] || null; }

const special = {
  brand(d, ch){
    const colors = d.colors||{}; const ty = d.typography||{};
    let h = `<div class="swatches">${Object.entries(colors).map(([k,c])=>`<div class="swatch"><div class="c" style="background:${esc(c)}"></div><div class="l"><b>${esc(label(k))}</b>${esc(c)}</div></div>`).join('')}</div>`;
    h += `<div class="fonts">${Object.entries(ty).map(([k,f])=>`<div class="font"><div class="s" style="font-family:'${esc(f.family)}';font-weight:${f.weight||400};text-transform:${f.case==='upper'?'uppercase':'none'};letter-spacing:${f.tracking||0}">${f.case==='upper'?'Edit like this':'Edit like this 0123'}</div><div class="l">${esc(label(k))} · ${esc(f.family)} ${f.weight||''} ${f.case||''}</div></div>`).join('')}</div>`;
    const rest = {...d}; delete rest.colors; delete rest.typography;
    return h + kv(rest, 'brand', ch);
  },
  layouts(d, ch, full){
    const colors = full.brand && full.brand.colors;
    const lib = d.library||[]; const sz = d.safeZones||{};
    let h = `<div class="layouts">${lib.map(l=>{
      const [aw,ah]=(l.aspect||'16:9').split(':').map(Number); const W = aw>=ah?240:135, H = W*ah/aw;
      const roles = {};
      const regs = (l.regions||[]).map(r=>{
        const cls = ['speaker','content','graphic'].includes(r.role)?r.role:'other';
        const rad = r.shape==='circle'?'50%':(r.radius? (r.radius*W/1920)+'px':'0');
        const border = r.border ? `border:${esc(r.border)};` : '';
        return `<div class="reg ${cls}" style="left:${r.x}%;top:${r.y}%;width:${r.w}%;height:${r.h}%;border-radius:${rad};${border}${r.shadow?'box-shadow:0 4px 14px #0008;':''}">${esc(r.role)}</div>`;
      }).join('');
      const safe = [['top:0;left:0;right:0;height',sz.topPct],['bottom:0;left:0;right:0;height',sz.bottomPct],['top:0;bottom:0;right:0;width',sz.rightPct]].filter(([,v])=>v).map(([s,v])=>`<div class="safe" style="inset:auto;${s}:${v}%"></div>`).join('');
      return `<div class="lay"><div class="frame" style="width:${W}px;height:${H}px">${regs}${safe}</div><h3>${esc(l.name||l.id)}</h3><p>${esc(l.aspect||'')} · ${esc(l.use||'')}</p>${(l.regions||[]).filter(r=>r.role!=='content'&&!(r.w===100&&r.h===100)).map(r=>`<p>${esc(r.role)}: x ${r.x}% y ${r.y}% · ${r.w}×${r.h}%${r.shape?' · '+esc(r.shape):''}${r.cutout?' · cutout':''}</p>`).join('')}</div>`;
    }).join('')}</div>`;
    if(sz.topPct||sz.bottomPct||sz.rightPct) h += `<div class="legend">Red striped bands are covered by platform UI. Keep graphics and captions out of them.</div>`;
    const rest = {...d}; delete rest.library;
    return h + kv(rest, 'layouts', ch) + `<details style="margin-top:12px"><summary class="meta">Layout specs as a table</summary>${table(lib.map(l=>({id:l.id,name:l.name,aspect:l.aspect,use:l.use,regions:l.regions})))}</details>`;
  },
  structure(d, ch){
    const bm = d.beatMap||[]; const segs = [...new Set(bm.map(b=>b.segment))];
    let h = bm.length ? `<div class="beat">${bm.map(b=>`<div style="flex:${b.endPct-b.startPct};background:${ROLE_COLORS[segs.indexOf(b.segment)%ROLE_COLORS.length]}" title="${esc(b.segment)} ${b.startPct}-${b.endPct}%">${esc(b.segment)}</div>`).join('')}</div>` : '';
    const rest = {...d}; delete rest.beatMap;
    return h + kv(rest, 'structure', ch);
  },
  templates(list){
    list = list || [];
    if(profile!=='base') list = list.filter(t=>!t.profiles||!t.profiles.length||t.profiles.includes(profile));
    const cats = [...new Set(list.map(t=>t.category||'other'))];
    return `<div class="bank-filter" id="bf"><button class="on" data-c="">All (${list.length})</button>${cats.map(c=>`<button data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    <div class="bank">${list.map(t=>`<div class="tpl" data-cat="${esc(t.category||'other')}"><div class="pv">${t.path?`<iframe loading="lazy" src="${esc(t.path)}" title="${esc(t.name)}"></iframe>`:''}</div><div class="body"><b>${esc(t.name||t.id)}</b> <span class="src">${esc(t.origin||'')}</span><div>${esc(t.use||'')}</div><div class="chips"><span class="chip">${esc(t.category||'')}</span>${t.durationSec?`<span class="chip">${t.durationSec}s</span>`:''}<span class="chip">${esc(t.build||'')}</span>${(t.layouts||[]).map(l=>`<span class="chip">${esc(l)}</span>`).join('')}</div>${t.variables?`<div style="margin-top:6px"><code>${esc(Object.keys(t.variables).join(', '))}</code></div>`:''}</div></div>`).join('')}</div>`;
  },
  evidence(e){
    e = e || {};
    let h = e.stats && e.stats.length ? table(e.stats) : '';
    if(e.frames && e.frames.length) h += `<div class="frames" style="margin-top:16px">${e.frames.map(f=>`<figure><img loading="lazy" src="${esc(f.path)}" alt=""><figcaption>${esc(f.source||'')} · ${f.time!=null?esc(f.time)+'s · ':''}${esc(f.note||'')}</figcaption></figure>`).join('')}</div>`;
    h += `<h3 style="font-size:14px;margin:18px 0 6px">Sources</h3>${table((M.meta&&M.meta.sources)||[])}`;
    return h || '<span class="empty">No evidence yet</span>';
  },
  profiles(){
    const p = M.profiles||{};
    return table(Object.entries(p).map(([id,v])=>({id,label:v.label,platform:v.platform,aspect:v.aspect,description:v.description,overrides:Object.keys(v).filter(k=>!['label','platform','aspect','description'].includes(k)).join(', ')||'none'})));
  }
};

function render(){
  const {data, changed} = view();
  const colors = (data.brand||{}).colors||{};
  if(colors.primary) document.documentElement.style.setProperty('--accent', colors.primary);
  const sub = (d,k)=>{ const s=new Set(); changed.forEach(p=>{ if(p===k||p.startsWith(k+'.')) s.add(p); }); return s; };
  document.getElementById('main').innerHTML = SECTIONS.map(([k,t,s])=>{
    let body;
    if(k==='templates') body = special.templates(M.templates);
    else if(k==='evidence') body = special.evidence(M.evidence);
    else if(k==='profiles') body = special.profiles();
    else if(k==='json') body = `<pre>${esc(JSON.stringify(M,null,2))}</pre>`;
    else if(special[k]) body = special[k](data[k]||{}, sub(data,k), data);
    else body = data[k] ? kv(data[k], k, sub(data,k)) : '<span class="empty">not set</span>';
    const n = k==='json'||k==='templates'||k==='evidence'||k==='profiles' ? 0 : sub(data,k).size;
    return `<section id="s-${k}"><h2>${t}${n?` <span class="src" style="color:var(--changed-ink)">${n} profile change${n>1?'s':''}</span>`:''}</h2>${s?`<p class="sub">${s}</p>`:''}${body}</section>`;
  }).join('');
  const bf = document.getElementById('bf');
  if(bf) bf.onclick = e=>{ const b=e.target.closest('button'); if(!b) return; bf.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); document.querySelectorAll('.tpl').forEach(t=>t.style.display=!b.dataset.c||t.dataset.cat===b.dataset.c?'':'none'); };
}

const meta = M.meta||{};
document.title = (meta.name?meta.name+' ':'')+'Video Manifest';
document.getElementById('title').textContent = document.title;
document.getElementById('meta').textContent = `v${meta.version||1} · ${meta.updated||''}`;
document.getElementById('nav').innerHTML = SECTIONS.map(([k,t])=>`<a href="#s-${k}">${t}</a>`).join('');
const tabs = document.getElementById('tabs');
tabs.innerHTML = [['base','Base'],...Object.entries(M.profiles||{}).map(([k,v])=>[k,v.label||k])].map(([k,l])=>`<button data-p="${k}" class="${k==='base'?'on':''}">${esc(l)}</button>`).join('');
tabs.onclick = e=>{ const b=e.target.closest('button'); if(!b) return; profile=b.dataset.p; tabs.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); render(); };
render();
</script>
</body>
</html>
