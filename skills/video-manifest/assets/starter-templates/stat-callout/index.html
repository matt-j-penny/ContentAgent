.card{position:absolute;right:6vw;top:50%;translate:0 -50%;background:color-mix(in srgb,var(--c-bg) 88%,transparent);border-radius:var(--radius);padding:2vw 3vw;text-align:center;--anim:pop}

</style></head><body data-loop="4"><div class="footage">FOOTAGE</div>

<script>const el=document.getElementById('n');document.addEventListener('play',()=>{const end=parseFloat(el.dataset.end??=el.textContent);const t0=performance.now();const f=t=>{const p=Math.min((t-t0)/900,1);el.textContent=Math.round(end*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)})</script>
