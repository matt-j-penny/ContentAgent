<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../_base.css"><link rel="stylesheet" href="../_brand.css"><style>
.list{position:absolute;left:6vw;top:50%;translate:0 -50%;display:grid;gap:1vw}
.it{display:flex;gap:1.2vw;align-items:center;background:color-mix(in srgb,var(--c-bg) 85%,transparent);border-radius:var(--radius);padding:1vw 1.6vw;--anim:slide}
.num{font-family:var(--font-numeric);color:var(--c-accent);font-weight:800;font-size:2vw}
.tx{font-size:2vw;font-weight:600}
</style></head><body data-loop="5"><div class="footage">FOOTAGE</div>
<div class="list">
<div class="it in" style="--i:0"><span class="num">01</span><span class="tx" data-var="item1">First point</span></div>
<div class="it in" style="--i:4"><span class="num">02</span><span class="tx" data-var="item2">Second point</span></div>
<div class="it in" style="--i:8"><span class="num">03</span><span class="tx" data-var="item3">Third point</span></div>
</div>
<script src="../_base.js"></script></body></html>
